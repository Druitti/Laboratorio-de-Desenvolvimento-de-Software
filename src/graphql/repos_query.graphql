# Lab01S01 — top 100 repos + métricas RQ01 (idade) e RQ02 (PRs aceitas)
query TopRepos($first: Int!) {
  search(query: "stars:>1 sort:stars-desc", type: REPOSITORY, first: $first) {
    repositoryCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on Repository {
        nameWithOwner
        url
        stargazerCount
        createdAt
        pullRequests(states: MERGED) {
          totalCount
        }
      }
    }
  }
}
