name: Lab03 S01
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selecao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r lab03/requirements.txt
      - run: python -m pytest lab03/tests --cov=lab03.selection --cov-report=term-missing --cov-fail-under=80
