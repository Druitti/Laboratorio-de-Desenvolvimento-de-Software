name: Lab05
on:
  push:
    paths:
      - "lab05/**"
      - ".github/workflows/lab05.yml"
  pull_request:
    paths:
      - "lab05/**"
      - ".github/workflows/lab05.yml"
permissions:
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest lab05/tests -q
